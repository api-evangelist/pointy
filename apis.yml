name: Pointy
description: >-
  Pointy was an Irish retail-technology startup (pointy.com), founded by Mark
  Cummins and Charles Bibby and backed by Seedcamp, that helped independent
  brick-and-mortar retailers put their in-store inventory online by connecting a
  simple barcode-scanning device or point-of-sale integration to a searchable
  online product page. Google acquired Pointy in 2020 and has since fully folded
  the product into Google's own tooling: pointy.com now redirects to Google
  Business Profile support, and the former Pointy app is now Google's Local
  Inventory app, which syncs in-store products to Google Search and Maps via POS
  systems such as Clover, Square, and Lightspeed. Pointy no longer operates as an
  independent company and publishes no standalone public API, developer portal,
  or SDKs; this API Evangelist profile is retained as a portfolio-lead record and
  historical marker rather than an active API provider.
